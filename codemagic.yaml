workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.horsemanago2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
