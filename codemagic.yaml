workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          echo "$CM_CERTIFICATE" | openssl base64 -d -A -out /tmp/certificate.p12
          echo "CM_CERTIFICATE var length:"; printf '%s' "$CM_CERTIFICATE" | wc -c
          echo "Decoded p12 file size:"; wc -c < /tmp/certificate.p12
          echo "First 8 bytes (hex, structural only):"; head -c 8 /tmp/certificate.p12 | xxd
          if [ -z "${CM_CERTIFICATE_PASSWORD+x}" ]; then
            keychain add-certificates --certificate /tmp/certificate.p12
          else
            keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          fi
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
