workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Set up App Store Connect API key
        script: |
          mkdir -p ~/private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" \
            | sed -E 's/-----BEGIN PRIVATE KEY-----[[:space:]]*/-----BEGIN PRIVATE KEY-----\n/' \
            | sed -E 's/[[:space:]]*-----END PRIVATE KEY-----/\n-----END PRIVATE KEY-----/' \
            > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          printf '\n' >> ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
      - name: Diagnose raw variable structure (no secret exposed)
        script: |
          echo "RAW_LENGTH:"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | wc -c
          echo "RAW_REAL_NEWLINE_COUNT:"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | wc -l
          echo "HAS_BEGIN_HEADER(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -c "BEGIN PRIVATE KEY" || echo 0
          echo "HAS_END_FOOTER(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -c "END PRIVATE KEY" || echo 0
          echo "HAS_CARRIAGE_RETURN(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -cP '\r' || echo 0
          echo "HAS_LITERAL_BACKSLASH_N(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -cF '\n' || echo 0
          echo "HAS_DOUBLE_QUOTE(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -cF '"' || echo 0
          echo "HAS_SPACE(1=yes):"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -cF ' ' || echo 0
      - name: Debug API key file (no secret exposed)
        script: |
          echo "--- First line ---"
          head -n 1 ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "--- Last line ---"
          tail -n 1 ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "--- Line count ---"
          wc -l ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "--- Byte count ---"
          wc -c ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "--- openssl validation ---"
          openssl pkey -in ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8 -noout -check && echo "KEY IS VALID" || echo "OPENSSL VALIDATION FAILED"
      - name: Build iOS
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive
      - name: Upload to App Store Connect
        script: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -teamID $DEVELOPMENT_TEAM
          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey $APP_STORE_CONNECT_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
    artifacts:
      - build/export/*.ipa
