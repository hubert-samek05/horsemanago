workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.horsemanago2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build frontend
        script: |
          npm run build
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          EXIT_CODE=$?
          set -e
          echo "=== Full xcodebuild log ==="
          cat /tmp/xcodebuild_logs/*.log 2>/dev/null || echo "No xcodebuild log file found"
          exit $EXIT_CODE
      - name: Inspect signed entitlements and binary
        script: |
          set +e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA path: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            TMP_UNZIP=/tmp/ipa_inspect
            rm -rf "$TMP_UNZIP" && mkdir -p "$TMP_UNZIP"
            unzip -q "$IPA_PATH" -d "$TMP_UNZIP"
            APP_BUNDLE=$(find "$TMP_UNZIP/Payload" -maxdepth 1 -name "*.app" | head -1)
            echo "=== App bundle: $APP_BUNDLE ==="
            echo "=== Embedded entitlements ==="
            codesign -d --entitlements :- "$APP_BUNDLE" 2>&1
            echo "=== Codesign verification ==="
            codesign -dvvv "$APP_BUNDLE" 2>&1
            echo "=== Provisioning profile entitlements ==="
            security cms -D -i "$APP_BUNDLE/embedded.mobileprovision" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>&1
            echo "=== Binary architectures ==="
            lipo -info "$APP_BUNDLE/App" 2>&1
            echo "=== Frameworks embedded ==="
            ls -la "$APP_BUNDLE/Frameworks" 2>&1
            echo "=== Deep signature verification (app + frameworks) ==="
            codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE" 2>&1
            echo "=== Per-framework signature check ==="
            for fw in "$APP_BUNDLE/Frameworks"/*; do
              echo "--- $fw ---"
              codesign -dvvv "$fw" 2>&1
            done
            echo "=== spctl assessment (expected to be irrelevant/rejected for iOS binaries, informational only) ==="
            spctl -a -vvv --type execute "$APP_BUNDLE" 2>&1 || true
          else
            echo "No IPA found to inspect"
          fi
          exit 0
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android-workflow:
    name: Android Build
    environment:
      groups:
        - google-play
      vars:
        BUNDLE_ID: "net.horsemanago2"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build frontend
        script: |
          npm run build
      - name: Update Capacitor
        script: |
          npx cap sync android
      - name: Build Android release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT
        track: internal
