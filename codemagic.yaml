workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.horsemanago2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          EXIT_CODE=$?
          set -e
          echo "=== Full xcodebuild log ==="
          cat /tmp/xcodebuild_logs/*.log 2>/dev/null || echo "No xcodebuild log file found"
          exit $EXIT_CODE
      - name: Inspect signed entitlements and binary
        script: |
          set +e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA path: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            TMP_UNZIP=/tmp/ipa_inspect
            rm -rf "$TMP_UNZIP" && mkdir -p "$TMP_UNZIP"
            unzip -q "$IPA_PATH" -d "$TMP_UNZIP"
            APP_BUNDLE=$(find "$TMP_UNZIP/Payload" -maxdepth 1 -name "*.app" | head -1)
            echo "=== App bundle: $APP_BUNDLE ==="
            echo "=== Embedded entitlements ==="
            codesign -d --entitlements :- "$APP_BUNDLE" 2>&1
            echo "=== Codesign verification ==="
            codesign -dvvv "$APP_BUNDLE" 2>&1
            echo "=== Provisioning profile entitlements ==="
            security cms -D -i "$APP_BUNDLE/embedded.mobileprovision" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>&1
            echo "=== Binary architectures ==="
            lipo -info "$APP_BUNDLE/App" 2>&1
            echo "=== Frameworks embedded ==="
            ls -la "$APP_BUNDLE/Frameworks" 2>&1
            echo "=== Deep signature verification (app + frameworks) ==="
            codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE" 2>&1
            echo "=== Per-framework signature check ==="
            for fw in "$APP_BUNDLE/Frameworks"/*; do
              echo "--- $fw ---"
              codesign -dvvv "$fw" 2>&1
            done
            echo "=== spctl assessment (expected to be irrelevant/rejected for iOS binaries, informational only) ==="
            spctl -a -vvv --type execute "$APP_BUNDLE" 2>&1 || true
          else
            echo "No IPA found to inspect"
          fi
          exit 0
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-simulator-diagnostic:
    name: iOS Simulator Crash Diagnostic
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Build for simulator
        script: |
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/simbuild.log
          echo "=== Build exit status: $? ==="
      - name: Boot simulator, launch app, capture crash
        script: |
          set +e
          APP_PATH=$(find build/DerivedData -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app not found in DerivedData, aborting."
            find build/DerivedData -maxdepth 6 -iname "*.app"
            exit 1
          fi
          DEVICE_ID=$(xcrun simctl create "DiagnosticIPhone" "iPhone 17 Pro Max" 2>/dev/null)
          echo "Created device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          sleep 20
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          echo "=== Starting log stream in background (App + WebContent + GPU processes) ==="
          xcrun simctl spawn "$DEVICE_ID" log stream --predicate 'process == "App" OR process CONTAINS "WebContent" OR process CONTAINS "com.apple.WebKit" OR eventMessage CONTAINS "crash" OR eventMessage CONTAINS "Terminat"' --style compact > /tmp/app_console.log 2>&1 &
          LOG_PID=$!
          sleep 2
          echo "=== Launching app ==="
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          echo "Launch exit code: $?"
          sleep 40
          echo "=== Process list (is App still running?) ==="
          xcrun simctl spawn "$DEVICE_ID" launchctl list 2>&1 | grep -i horsemanago || echo "App process NOT found in launchctl list"
          kill $LOG_PID 2>/dev/null
          echo "=== App console output ==="
          cat /tmp/app_console.log
          echo "=== Listing DiagnosticReports directory (unfiltered) ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>&1
          echo "=== Diagnostic Reports content (all .ips files) ==="
          find ~/Library/Logs/DiagnosticReports -iname "*.ips" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          echo "=== Listing CoreSimulator device logs directory ==="
          find "$HOME/Library/Logs/CoreSimulator/$DEVICE_ID" -type f 2>&1
          echo "=== Full raw log dump for last 2 minutes (unfiltered, all processes) ==="
          xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact 2>&1 | grep -iE "horsemanago|net\.horsemanago2|App\[|crash|fault|exception|terminat|kill" | tail -200
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null
          xcrun simctl delete "$DEVICE_ID" 2>/dev/null
    artifacts:
      - /tmp/app_console.log
      - /tmp/simbuild.log
