workflows:
  ios-workflow:
    name: iOS Build
    environment:
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        DEVELOPMENT_TEAM: $DEVELOPMENT_TEAM
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Setup Code Signing
        script: |
          echo "Setting up code signing..."
          # Import certificate
          echo $CM_CERTIFICATE | base64 --decode > certificate.p12
          # Import provisioning profile
          echo $CM_PROVISIONING_PROFILE | base64 --decode > profile.mobileprovision
          # Create keychain
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P $CM_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-toolkit:,apple: -s -k "" build.keychain
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build iOS
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROVISIONING_PROFILE_SPECIFIER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive
      - name: Upload to App Store Connect
        script: |
          echo $APP_STORE_CONNECT_API_KEY > AuthKey.p8
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -uploadToAppStore \
            -authenticationKeyPath AuthKey.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            -allowProvisioningUpdates
    artifacts:
      - build/export/*.ipa
