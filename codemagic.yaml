workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.horsemanago2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Patch Apple Sign-In plugin
        script: |
          PLUGIN_FILE="node_modules/@capacitor-community/apple-sign-in/ios/Sources/SignInWithApple/Plugin.swift"
          cat > "$PLUGIN_FILE" << 'PLUGIN_EOF'
          import Foundation
          import Capacitor
          import AuthenticationServices
          import UIKit

          @objc(SignInWithApple)
          public class SignInWithApple: CAPPlugin, CAPBridgedPlugin {
              public let identifier = "SignInWithApple"
              public let jsName = "SignInWithApple"
              public let pluginMethods: [CAPPluginMethod] = [
                  CAPPluginMethod(name: "authorize", returnType: CAPPluginReturnPromise),
              ]

              @objc func authorize(_ call: CAPPluginCall) {
                  let appleIDProvider = ASAuthorizationAppleIDProvider()
                  let request = appleIDProvider.createRequest()
                  request.requestedScopes = getRequestedScopes(from: call)
                  request.state = call.getString("state")
                  request.nonce = call.getString("nonce")

                  let defaults = UserDefaults()
                  defaults.setValue(call.callbackId, forKey: "callbackId")

                  self.bridge?.saveCall(call)

                  let authorizationController = ASAuthorizationController(authorizationRequests: [request])
                  authorizationController.delegate = self
                  authorizationController.presentationContextProvider = self
                  authorizationController.performRequests()
              }

              func getRequestedScopes(from call: CAPPluginCall) -> [ASAuthorization.Scope]? {
                  var requestedScopes: [ASAuthorization.Scope] = []

                  if let scopesStr = call.getString("scopes") {
                      if scopesStr.contains("name") {
                          requestedScopes.append(.fullName)
                      }

                      if scopesStr.contains("email") {
                          requestedScopes.append(.email)
                      }
                  }

                  if requestedScopes.count > 0 {
                      return requestedScopes
                  }

                  return nil
              }
          }

          extension SignInWithApple: ASAuthorizationControllerDelegate {
              public func authorizationController(controller: ASAuthorizationController, didCompleteWithAuthorization authorization: ASAuthorization) {
                  guard let appleIDCredential = authorization.credential as? ASAuthorizationAppleIDCredential else { return }

                  let defaults = UserDefaults()
                  let id = defaults.string(forKey: "callbackId") ?? ""
                  guard let call = self.bridge?.savedCall(withID: id) else {
                      return
                  }

                  let result = [
                      "response": [
                          "user": appleIDCredential.user,
                          "email": appleIDCredential.email,
                          "givenName": appleIDCredential.fullName?.givenName,
                          "familyName": appleIDCredential.fullName?.familyName,
                          "identityToken": String(data: appleIDCredential.identityToken!, encoding: .utf8),
                          "authorizationCode": String(data: appleIDCredential.authorizationCode!, encoding: .utf8)
                      ]
                  ]

                  call.resolve(result)
                  self.bridge?.releaseCall(call)
              }

              public func authorizationController(controller: ASAuthorizationController, didCompleteWithError error: Error) {
                  let defaults = UserDefaults()
                  let id = defaults.string(forKey: "callbackId") ?? ""
                  guard let call = self.bridge?.savedCall(withID: id) else {
                      return
                  }
                  call.reject(error.localizedDescription)
                  self.bridge?.releaseCall(call)
              }
          }

          extension SignInWithApple: ASAuthorizationControllerPresentationContextProviding {
              public func presentationAnchor(for controller: ASAuthorizationController) -> ASPresentationAnchor {
                  if let bridge = self.bridge, let viewController = bridge.viewController, let window = viewController.view.window {
                      return window
                  }
                  return UIApplication.shared.windows.first ?? UIWindow()
              }
          }
          PLUGIN_EOF
          echo "Patched Plugin.swift:"
          cat "$PLUGIN_FILE"
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Regenerate provisioning profile with Sign In with Apple entitlement
        script: |
          set +e
          echo "Enabling Sign In with Apple capability on bundle ID (if not already enabled)..."
          app-store-connect bundle-id capabilities enable SIGN_IN_WITH_APPLE \
            --bundle-id-identifier "$BUNDLE_ID" 2>&1 || echo "Capability already enabled or could not be changed, continuing"

          echo "Deleting existing App Store distribution profiles for $BUNDLE_ID so a fresh one gets generated with the current entitlements..."
          PROFILE_IDS=$(app-store-connect list-profiles \
            --bundle-id-identifier "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --json 2>/dev/null | grep -o '"id"[^,}]*' | sed 's/"id"[: ]*"\([^"]*\)"/\1/')

          for PROFILE_ID in $PROFILE_IDS; do
            echo "Deleting profile $PROFILE_ID"
            app-store-connect delete-profile "$PROFILE_ID" 2>&1 || true
          done
          set -e
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          EXIT_CODE=$?
          set -e
          echo "=== Full xcodebuild log ==="
          cat /tmp/xcodebuild_logs/*.log 2>/dev/null || echo "No xcodebuild log file found"
          exit $EXIT_CODE
      - name: Inspect signed entitlements and binary
        script: |
          set +e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA path: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            TMP_UNZIP=/tmp/ipa_inspect
            rm -rf "$TMP_UNZIP" && mkdir -p "$TMP_UNZIP"
            unzip -q "$IPA_PATH" -d "$TMP_UNZIP"
            APP_BUNDLE=$(find "$TMP_UNZIP/Payload" -maxdepth 1 -name "*.app" | head -1)
            echo "=== App bundle: $APP_BUNDLE ==="
            echo "=== Embedded entitlements ==="
            codesign -d --entitlements :- "$APP_BUNDLE" 2>&1
            echo "=== Codesign verification ==="
            codesign -dvvv "$APP_BUNDLE" 2>&1
            echo "=== Provisioning profile entitlements ==="
            security cms -D -i "$APP_BUNDLE/embedded.mobileprovision" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>&1
            echo "=== Binary architectures ==="
            lipo -info "$APP_BUNDLE/App" 2>&1
            echo "=== Frameworks embedded ==="
            ls -la "$APP_BUNDLE/Frameworks" 2>&1
            echo "=== Deep signature verification (app + frameworks) ==="
            codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE" 2>&1
            echo "=== Per-framework signature check ==="
            for fw in "$APP_BUNDLE/Frameworks"/*; do
              echo "--- $fw ---"
              codesign -dvvv "$fw" 2>&1
            done
            echo "=== spctl assessment (expected to be irrelevant/rejected for iOS binaries, informational only) ==="
            spctl -a -vvv --type execute "$APP_BUNDLE" 2>&1 || true
          else
            echo "No IPA found to inspect"
          fi
          exit 0
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android-workflow:
    name: Android Build
    environment:
      groups:
        - google-play
      vars:
        BUNDLE_ID: "net.horsemanago2"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync android
      - name: Build Android release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT
        track: internal
