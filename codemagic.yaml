workflows:
  ios-workflow:
    name: iOS Build
    integrations:
      app_store_connect: horsemanago-key
    environment:
      xcode: latest
      groups:
        - apple-credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.horsemanago2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Build ipa for distribution
        script: |
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          EXIT_CODE=$?
          set -e
          echo "=== Full xcodebuild log ==="
          cat /tmp/xcodebuild_logs/*.log 2>/dev/null || echo "No xcodebuild log file found"
          exit $EXIT_CODE
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-simulator-diagnostic:
    name: iOS Simulator Crash Diagnostic
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.horsemanago2"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Update Capacitor
        script: |
          npx cap sync ios
      - name: Build for simulator
        script: |
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build 2>&1 | tee /tmp/simbuild.log
          echo "=== Build exit status: $? ==="
      - name: Boot simulator, launch app, capture crash
        script: |
          set +e
          APP_PATH=$(find build/DerivedData -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "Found app at: $APP_PATH"
          DEVICE_ID=$(xcrun simctl create "DiagnosticIPhone" "iPhone 15" 2>/dev/null)
          echo "Created device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          sleep 20
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          echo "=== Starting log stream in background ==="
          xcrun simctl spawn "$DEVICE_ID" log stream --predicate 'process == "App"' --style compact > /tmp/app_console.log 2>&1 &
          LOG_PID=$!
          sleep 2
          echo "=== Launching app ==="
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          echo "Launch exit code: $?"
          sleep 15
          kill $LOG_PID 2>/dev/null
          echo "=== App console output ==="
          cat /tmp/app_console.log
          echo "=== Diagnostic Reports (crash files) ==="
          find ~/Library/Logs/DiagnosticReports -iname "*App*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          find "$HOME/Library/Logs/CoreSimulator/$DEVICE_ID" -iname "*crash*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null
          xcrun simctl delete "$DEVICE_ID" 2>/dev/null
    artifacts:
      - /tmp/app_console.log
      - /tmp/simbuild.log
